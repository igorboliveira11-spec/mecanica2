<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="Mecânica na Prática: explicações simples para grandes conhecimentos em mecânica e manutenção industrial.">
  <title>Mecânica na Prática | Links oficiais</title>
  <style>
    :root { --yellow:#ffbd00; --bg:#080808; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; padding:28px 16px; display:flex; align-items:center; justify-content:center; color:#f7f7f7; font-family:Arial,Helvetica,sans-serif; background:radial-gradient(ellipse at top,#27200b 0%,#101010 36%,var(--bg) 72%); }
    .page { width:min(100%,440px); text-align:center; }
    .logo-wrap { width:180px; height:180px; margin:0 auto 18px; border-radius:50%; overflow:hidden; border:3px solid var(--yellow); box-shadow:0 0 30px #ffbd002b; background:#080808; }
    .logo-wrap img { width:100%; height:100%; object-fit:cover; display:block; }
    h1 { margin:0; font-size:clamp(1.65rem,7vw,2.2rem); letter-spacing:.03em; text-transform:uppercase; }
    h1 span { color:var(--yellow); }
    .tagline { color:#d3d3d3; line-height:1.5; margin:10px 0 22px; font-size:.98rem; }
    .divider { width:72px; height:3px; background:var(--yellow); margin:0 auto 22px; border-radius:9px; }
    .links { display:grid; gap:12px; }
    .link { min-height:58px; display:flex; align-items:center; justify-content:center; gap:12px; padding:15px 18px; border:1px solid #353535; border-radius:13px; color:#f7f7f7; text-decoration:none; font-weight:700; background:linear-gradient(135deg,#1b1b1b,#101010); transition:transform .18s,border-color .18s,background .18s; }
    .link:hover { transform:translateY(-2px); border-color:var(--yellow); background:#222; }
    .link.primary { background:var(--yellow); border-color:var(--yellow); color:#101010; }
    .link.primary:hover { background:#ffd24a; }
    .symbol { width:24px; display:inline-flex; align-items:center; justify-content:center; font-size:1.2rem; }
    .note { margin:17px 0 0; color:#929292; font-size:.78rem; line-height:1.5; }
    footer { margin-top:28px; color:#777; font-size:.75rem; letter-spacing:.05em; }
    @media (max-width:380px) { .logo-wrap {width:150px;height:150px;} .link{min-height:54px;} }
  </style>
</head>
<body>
  <main class="page">
    <div class="logo-wrap">
<img src="./logo-mecanica-na-pratica.png" alt="Logo Mecânica na Prática" class="logo">
    </div>
    <h1>Mecânica <span>na Prática</span></h1>
    <p class="tagline">Explicações simples para grandes conhecimentos.<br>Manutenção mecânica e industrial na prática.</p>
    <div class="divider"></div>
    <nav class="links" aria-label="Links de contato">
      <a class="link primary" id="whatsappLink" href="https://wa.me/" target="_blank" rel="noopener noreferrer">
        <span class="symbol">✆</span><span id="whatsappLabel">Falar pelo WhatsApp</span>
      </a>
      <a class="link" id="emailLink" href="mailto:mecanicanapratica999@gmail.com">
        <span class="symbol">✉</span><span id="emailLabel">Falar pelo e-mail</span>
      </a>
      <a class="link" id="websiteLink" href="https://www.sp.senai.br/" target="_blank" rel="noopener noreferrer">
        <span class="symbol">↗</span><span>Visitar o site do SENAI</span>
      </a>
    </nav>
    <p class="note">Entre em contato ou acesse o portal oficial do SENAI.</p>
    <footer>© <span id="year"></span> MECÂNICA NA PRÁTICA</footer>
  </main>
  <script>
    // Preencha com seu número incluindo código do Brasil e DDD, somente números.
    const WHATSAPP_NUMBER = "5511962781456"; // Exemplo: "5511999999999"

    const whatsappLink = document.getElementById("whatsappLink");
    const whatsappLabel = document.getElementById("whatsappLabel");
    if (WHATSAPP_NUMBER.trim()) {
      whatsappLink.href = "https://wa.me/" + WHATSAPP_NUMBER.replace(/\D/g, "");
    } else {
      whatsappLink.addEventListener("click", function(event) {
        event.preventDefault();
        alert("Adicione seu número na variável WHATSAPP_NUMBER dentro do arquivo index.html.");
      });
    }
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
